[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-ai-assistant"
version = "0.1.0"
description = "End-to-End Financial Analysis AI Assistant using RAG and Text-to-SQL on SEC filings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Engineering Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "chromadb>=0.5.5",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlglot>=25.0.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
