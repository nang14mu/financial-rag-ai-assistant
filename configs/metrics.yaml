metrics:
  total_revenue:
    name: "Total Revenue"
    category: "income_statement"
    unit: "USD"
    description: "Total revenue or net sales generated by the company"
    us_gaap_tags:
      - "RevenueFromContractWithCustomerExcludingAssessedTax"
      - "SalesRevenueNet"
      - "Revenues"
      - "SalesRevenueGoodsNet"

  gross_profit:
    name: "Gross Profit"
    category: "income_statement"
    unit: "USD"
    description: "Revenue minus cost of goods sold"
    us_gaap_tags:
      - "GrossProfit"

  operating_income:
    name: "Operating Income"
    category: "income_statement"
    unit: "USD"
    description: "Operating income or operating profit before interest and taxes"
    us_gaap_tags:
      - "OperatingIncomeLoss"

  net_income:
    name: "Net Income"
    category: "income_statement"
    unit: "USD"
    description: "Net income or net profit attributable to common shareholders"
    us_gaap_tags:
      - "NetIncomeLoss"
      - "ProfitLoss"

  research_and_development:
    name: "Research and Development Expense"
    category: "income_statement"
    unit: "USD"
    description: "Total R&D expenditure"
    us_gaap_tags:
      - "ResearchAndDevelopmentExpense"
      - "ResearchAndDevelopmentExpenseSoftwareExcludingAcquiredInProcessCost"

  diluted_eps:
    name: "Diluted Earnings Per Share"
    category: "income_statement"
    unit: "USD/share"
    description: "Diluted earnings per common share"
    us_gaap_tags:
      - "EarningsPerShareDiluted"

  total_assets:
    name: "Total Assets"
    category: "balance_sheet"
    unit: "USD"
    description: "Sum of all current and non-current assets"
    us_gaap_tags:
      - "Assets"

  total_liabilities:
    name: "Total Liabilities"
    category: "balance_sheet"
    unit: "USD"
    description: "Sum of all current and non-current liabilities"
    us_gaap_tags:
      - "Liabilities"

  operating_cash_flow:
    name: "Operating Cash Flow"
    category: "cash_flow"
    unit: "USD"
    description: "Net cash provided by operating activities"
    us_gaap_tags:
      - "NetCashProvidedByUsedInOperatingActivities"

  capital_expenditures:
    name: "Capital Expenditures"
    category: "cash_flow"
    unit: "USD"
    description: "Payments for property, plant, and equipment"
    us_gaap_tags:
      - "PaymentsToAcquireProductiveAssets"
      - "PaymentsToAcquirePropertyPlantAndEquipment"
